<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Hiragino Sans', 'Noto Sans JP', sans-serif">
  <rect x="0" y="0" width="900" height="460" fill="#ffffff"/>

  <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">メタノールメーザーのポンピングサイクル（放射ポンピングの例）</text>

  <!-- energy axis (simple vertical line, manual arrowhead, no rotated label) -->
  <line x1="90" y1="400" x2="90" y2="90" stroke="#9ca3af" stroke-width="2"/>
  <polygon points="82,90 90,72 98,90" fill="#9ca3af"/>
  <text x="90" y="60" text-anchor="middle" font-size="13" fill="#6b7280">エネルギー</text>

  <!-- level 3 (pump level, top) -->
  <line x1="120" y1="110" x2="760" y2="110" stroke="#4b5563" stroke-width="3"/>
  <text x="770" y="105" font-size="15" fill="#374151" font-weight="700">準位3</text>
  <text x="770" y="123" font-size="13" fill="#374151">（ポンプ準位）</text>

  <!-- level 2 (metastable upper maser level) -->
  <line x1="120" y1="230" x2="760" y2="230" stroke="#7c3aed" stroke-width="4"/>
  <text x="770" y="225" font-size="15" fill="#7c3aed" font-weight="700">準位2</text>
  <text x="770" y="243" font-size="13" fill="#7c3aed">（準安定・上準位）</text>

  <!-- level 1 (lower maser level) -->
  <line x1="120" y1="380" x2="760" y2="380" stroke="#0891b2" stroke-width="4"/>
  <text x="770" y="375" font-size="15" fill="#0891b2" font-weight="700">準位1</text>
  <text x="770" y="393" font-size="13" fill="#0891b2">（下準位）</text>

  <!-- Step 1: pump absorption 1 -> 3 (infrared photon), straight arrow -->
  <line x1="220" y1="375" x2="220" y2="125" stroke="#f59e0b" stroke-width="4"/>
  <polygon points="210,125 220,105 230,125" fill="#f59e0b"/>
  <text x="150" y="180" font-size="14" fill="#b45309" font-weight="700">① 赤外線光子</text>
  <text x="150" y="198" font-size="14" fill="#b45309" font-weight="700">を吸収</text>

  <!-- Step 2: fast decay 3 -> 2 (non-radiative, dashed) -->
  <line x1="420" y1="115" x2="420" y2="220" stroke="#4b5563" stroke-width="3" stroke-dasharray="6,5"/>
  <polygon points="410,220 420,238 430,220" fill="#4b5563"/>
  <text x="450" y="165" font-size="14" fill="#4b5563" font-weight="700">② 準位2へ</text>
  <text x="450" y="183" font-size="14" fill="#4b5563" font-weight="700">すばやく緩和</text>

  <!-- Step 3: maser transition 2 -> 1 (stimulated emission) -->
  <line x1="620" y1="235" x2="620" y2="375" stroke="#dc2626" stroke-width="4"/>
  <polygon points="610,375 620,393 630,375" fill="#dc2626"/>
  <text x="655" y="290" font-size="14" fill="#dc2626" font-weight="700">③ 誘導放出</text>
  <text x="655" y="308" font-size="14" fill="#dc2626" font-weight="700">6.7 GHzメーザー光</text>

  <text x="450" y="430" text-anchor="middle" font-size="14" fill="#374151">① → ② → ③ を繰り返すことで、準位2に分子がたまり続け、反転分布とメーザー放射が維持される</text>
</svg>
